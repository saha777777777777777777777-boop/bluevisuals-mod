name: build
on: [push, workflow_dispatch]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 21}}
      - {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.11.1}}
      - {name: Unpack, run: unzip -o mod.zip -d mod}
      - {name: Build, run: gradle build --no-daemon, working-directory: mod}
      - {name: Publish, env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}, run: "gh release delete latest -y --cleanup-tag || true; gh release create latest mod/build/libs/*.jar --title Blue --notes Latest"}
